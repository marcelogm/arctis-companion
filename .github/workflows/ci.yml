name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
          components: rustfmt
      - run: cargo fmt --all --check
      - run: cargo xtask check-rules
      - run: cargo xtask check-doc-paths
      - run: cargo xtask check-pure
      - name: check-commits for a pull request
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: cargo xtask check-commits --range "$BASE_SHA..$HEAD_SHA" --pr-title "$PR_TITLE" --pr-body "$PR_BODY"
      - name: check-commits for main
        if: github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000'
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: cargo xtask check-commits --range "$BEFORE_SHA..$GITHUB_SHA"

  test:
    needs: rules
    runs-on: ubuntu-latest
    container: fedora:44
    steps:
      - run: dnf install -y --setopt=install_weak_deps=False git gcc gettext clang-devel pipewire-devel gtk4-devel libadwaita-devel blueprint-compiler
      - uses: actions/checkout@v4
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
          components: clippy, llvm-tools-preview
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace --exclude arctis-ui --exclude arctis-app
      - run: cargo llvm-cov --package arctis-core --fail-under-lines 90

  ui:
    needs: rules
    runs-on: ubuntu-latest
    container: fedora:44
    steps:
      - run: dnf install -y --setopt=install_weak_deps=False git gcc clang-devel pipewire-devel gtk4-devel libadwaita-devel blueprint-compiler gettext weston mesa-dri-drivers dbus-daemon glib2
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
      - name: widget and app tests under headless weston
        env:
          GDK_BACKEND: wayland
          GSK_RENDERER: cairo
          WAYLAND_DISPLAY: wayland-ci
        run: |
          export XDG_RUNTIME_DIR="$(mktemp -d)"
          weston --backend=headless --socket=wayland-ci --idle-time=0 &
          until [ -S "$XDG_RUNTIME_DIR/wayland-ci" ]; do sleep 0.1; done
          cargo test --package arctis-ui --package arctis-app

  extension:
    needs: rules
    runs-on: ubuntu-latest
    container: fedora:44
    defaults:
      run:
        working-directory: extension
    steps:
      - run: dnf install -y --setopt=install_weak_deps=False nodejs npm gjs dbus-daemon gettext gnome-shell unzip diffutils
        working-directory: /
      - uses: actions/checkout@v4
      - run: npm ci
      - run: npx eslint .
      - run: npm test
      - run: npm run check-po
      - run: npm run pack
      - run: unzip -l dist/arctis-companion@marcelogm.github.io.shell-extension.zip
      - uses: actions/upload-artifact@v4
        with:
          name: shell-extension
          path: extension/dist/arctis-companion@marcelogm.github.io.shell-extension.zip

  audio-integration:
    needs: test
    runs-on: ubuntu-latest
    container: fedora:44
    timeout-minutes: 30
    steps:
      - run: dnf install -y --setopt=install_weak_deps=False git gcc clang-devel pipewire-devel pipewire pipewire-utils wireplumber dbus-daemon
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
      - run: crates/audio/tests/headless/run.sh

  flatpak:
    needs: test
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-50
      options: --privileged -v /:/host
    steps:
      - name: Free runner disk space
        run: rm -rf /host/usr/share/dotnet /host/usr/local/lib/android /host/opt/ghc /host/opt/hostedtoolcache/CodeQL /host/usr/local/share/boost
      - uses: actions/checkout@v4
      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: arctis-companion.flatpak
          manifest-path: build-aux/io.github.marcelogm.ArctisCompanion.json
          cache-key: flatpak-builder-${{ github.sha }}
