name: nightly

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mutants:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-mutants
      - run: cargo mutants --package arctis-core --test-workspace=false

  proptest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
      - run: cargo test --package arctis-core
        env:
          PROPTEST_CASES: "2560"

  shell-smoke:
    runs-on: ubuntu-latest
    container: fedora:44
    continue-on-error: true
    steps:
      - run: dnf install -y --setopt=install_weak_deps=False nodejs npm gjs dbus-daemon gettext gnome-shell mesa-dri-drivers procps-ng
      - uses: actions/checkout@v4
      - run: npm ci
        working-directory: extension
      - name: headless shell with the fake app
        working-directory: extension
        run: for scenario in connected low-battery absent; do npm run smoke -- "$scenario"; done
