[workspace]
resolver = "3"
members = ["crates/core", "crates/hid", "crates/audio", "crates/ui", "crates/app", "xtask"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
publish = false

[workspace.dependencies]
adw = { package = "libadwaita", version = "0.9", features = ["v1_9"] }
arctis-audio = { path = "crates/audio" }
arctis-core = { path = "crates/core" }
arctis-hid = { path = "crates/hid" }
arctis-ui = { path = "crates/ui" }
gettext-rs = { version = "0.7.7", features = ["gettext-system"] }
glib-build-tools = "0.22"
gtk = { package = "gtk4", version = "0.11", features = ["gnome_50"] }
pipewire = "0.10"
proptest = "1"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
cognitive_complexity = "deny"
too_many_lines = "deny"
excessive_nesting = "deny"
too_many_arguments = "deny"
unwrap_used = "deny"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
missing_safety_doc = "allow"
undocumented_unsafe_blocks = "allow"
doc_markdown = "allow"
